  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Hidden static forms so Netlify's build bot can detect and register these forms.
         The React app submits to these same form names via fetch() at runtime.
         netlify-honeypot="bot-field" enables spam prevention: a bot-field input is
         included (and stays empty for real humans); Netlify silently rejects any
         submission where it's filled in. -->
    <form name="waitlist-user" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" />
      <input name="bot-field" />
    </form>
    <form name="waitlist-investor" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" />
      <textarea name="note"></textarea>
      <input name="bot-field" />
    </form>
    <form name="waitlist-agent" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="agentName" />
      <input type="text" name="category" />
      <input type="text" name="llm" />
      <input type="text" name="builderName" />
      <input type="email" name="email" />
      <input type="text" name="country" />
      <input type="text" name="enterMI" />
      <input name="bot-field" />
    </form>
